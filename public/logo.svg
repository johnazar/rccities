<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logo-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark (x: 4 to 74, y: 6 to 74) -->
  <g transform="translate(6, 4)">
    <!-- Crawler Track Unit at Base -->
    <rect x="2" y="52" width="64" height="15" rx="7.5" fill="#14171E" stroke="url(#logo-gold)" stroke-width="2.5" />
    
    <!-- Track Bogie Wheels -->
    <circle cx="11" cy="59.5" r="4" fill="url(#logo-orange)" />
    <circle cx="11" cy="59.5" r="1.5" fill="#FFFFFF" />

    <circle cx="23" cy="59.5" r="3.5" fill="url(#logo-gold)" />
    <circle cx="23" cy="59.5" r="1.5" fill="#14171E" />

    <circle cx="34" cy="59.5" r="3.5" fill="url(#logo-gold)" />
    <circle cx="34" cy="59.5" r="1.5" fill="#14171E" />

    <circle cx="45" cy="59.5" r="3.5" fill="url(#logo-gold)" />
    <circle cx="45" cy="59.5" r="1.5" fill="#14171E" />

    <circle cx="57" cy="59.5" r="4" fill="url(#logo-orange)" />
    <circle cx="57" cy="59.5" r="1.5" fill="#FFFFFF" />

    <!-- Excavator Boom & Toothed Digger Bucket -->
    <g filter="url(#logo-glow)">
      <!-- Articulated Hydraulic Boom -->
      <path d="M 16 48 L 26 22 L 46 12 L 62 24" fill="none" stroke="url(#logo-gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Hydraulic Cylinder Ram -->
      <path d="M 22 40 L 36 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

      <!-- Excavator Toothed Bucket -->
      <path d="M 62 24 L 68 32 L 63 40 L 53 36 Z" fill="url(#logo-orange)" stroke="#FFFFFF" stroke-width="0.8" />
      <polygon points="68,32 71,34 69,36" fill="#FFFFFF" />
      <polygon points="66,36 69,38 67,40" fill="#FFFFFF" />
      <polygon points="63,40 65,43 62,43" fill="#FFFFFF" />

      <!-- Pivot Pins -->
      <circle cx="16" cy="48" r="3.5" fill="#FFFFFF" stroke="#0E1015" stroke-width="1.2" />
      <circle cx="26" cy="22" r="2.8" fill="#FFFFFF" stroke="#0E1015" stroke-width="1.2" />
      <circle cx="46" cy="12" r="2.5" fill="#FFFFFF" stroke="#0E1015" stroke-width="1.2" />
      <circle cx="62" cy="24" r="2.8" fill="#FFFFFF" stroke="#0E1015" stroke-width="1.2" />
    </g>

    <!-- RC Remote Transmitter Handle / Trigger -->
    <g>
      <line x1="16" y1="48" x2="16" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <circle cx="16" cy="26" r="1.8" fill="#F59E0B" />
      <path d="M 16 48 C 10 48 5 51 5 56 L 16 56 Z" fill="url(#logo-gold)" />
    </g>

    <!-- Dual CC Interlocking Arcs in Mark -->
    <path d="M 36 38 C 29 38 25 42 25 48 C 25 54 29 57 36 57" fill="none" stroke="url(#logo-gold)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 50 38 C 43 38 39 42 39 48 C 39 54 43 57 50 57" fill="none" stroke="url(#logo-orange)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Typography: RC CITIES -->
  <g transform="translate(86, 0)">
    <text x="0" y="44" font-family="'Syne', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">
      RC
      <tspan fill="url(#logo-gold)" dx="6">CITIES</tspan>
    </text>
    
    <!-- Sub-label: DUBAI // COFFEE MEETS THRILL -->
    <text x="2" y="62" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="600" letter-spacing="0.22em" fill="#C2A683">
      DUBAI · COFFEE MEETS THRILL
    </text>
  </g>
</svg>
